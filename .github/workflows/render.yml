name: render
run-name: ${{ inputs.auftrag }}

# Auftrag kommt verschlüsselt als Release-Anhang (auftrag.bin), Ergebnis geht verschlüsselt als Artefakt zurück.
# Schlüssel nur als Secret AUFTRAG_SCHLUESSEL. Logs bewusst knapp.
on:
  workflow_dispatch:
    inputs:
      auftrag: { description: "Release-Tag", required: true }
      ids: { description: "JSON-Liste", required: true }

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        id: ${{ fromJSON(inputs.ids) }}
    steps:
      - name: Auftrag holen
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release download "${{ inputs.auftrag }}" -R "$GITHUB_REPOSITORY" -p auftrag.bin -D . >/dev/null
      - name: Entschlüsseln
        env: { K: "${{ secrets.AUFTRAG_SCHLUESSEL }}" }
        run: |
          mkdir p
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:K -in auftrag.bin | tar -xz -C p
          rm auftrag.bin
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Vorbereiten
        working-directory: p
        run: |
          sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq --no-install-recommends libnss3 libdbus-1-3 libatk1.0-0t64 libgbm-dev libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0t64 libpango-1.0-0 libcairo2 libcups2t64 >/dev/null
          npm install --no-audit --no-fund --loglevel=error >/dev/null
          npx remotion browser ensure >/dev/null
      - name: Rendern
        working-directory: p
        run: npx remotion render src/Root.tsx "${{ matrix.id }}" ../out.mp4 --concurrency=4 --crf=17 --log=error --timeout=240000 >/dev/null
      - name: Verschlüsseln
        env: { K: "${{ secrets.AUFTRAG_SCHLUESSEL }}" }
        run: openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:K -in out.mp4 -out ergebnis.bin && rm out.mp4
      - uses: actions/upload-artifact@v4
        with: { name: "${{ matrix.id }}", path: ergebnis.bin, retention-days: 1, compression-level: 0 }
